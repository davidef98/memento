name: memento

description: "Memento is a demo application built with Flutter. 
Its primary goal is to showcase a Clean Architecture built around 
a clear separation of layers, organized by feature."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.1.0
  books_api:
    path: packages/books_api
  open_library_books_api:
    path: packages/open_library_books_api
  shelf_api:
    path: packages/shelf_api
  shared_preferences_shelf_api:
    path: packages/shared_preferences_shelf_api
  app_settings_api:
    path: packages/app_settings_api
  shared_preferences_app_settings_api:
    path: packages/shared_preferences_app_settings_api
  books_repository:
    path: packages/books_repository
  app_settings_repository:
    path: packages/app_settings_repository
  stream_transform: ^2.1.2
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  google_fonts: ^6.3.2
  flutter_svg: ^2.2.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/

workspace:
  - packages/app_settings_api
  - packages/app_settings_repository
  - packages/books_api
  - packages/books_repository
  - packages/open_library_books_api
  - packages/shared_preferences_app_settings_api
  - packages/shared_preferences_shelf_api
  - packages/shelf_api

